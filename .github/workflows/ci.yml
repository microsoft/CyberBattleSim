on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - wiblum/*
      - blumu/*
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements.dev.txt
            setup.py

      - name: Create virtual environment and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install -e ".[dev]"

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Pull typing stubs from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: typingstubs-${{ runner.os }}-${{ hashFiles('createstubs.sh') }}
          restore-keys: typingstubs-${{ runner.os }}-${{ hashFiles('createstubs.sh') }}
          path: typings/

      - uses: chartboost/ruff-action@e18ae971ccee1b2d7bbef113930f00c670b78da4 # v1.0.0
        with:
          version: 0.5.6

      - name: Typecheck [pyright]
        run: |
          which python
          echo $PATH
          ./createstubs.sh
          pyright

      - name: Test [pytest]
        run: |
          uv pip install six pexpect wcwidth pytest-azurepipelines
          python -m pytest -v cyberbattle

      - name: Papermill all notebooks in quick mode
        run: |
          python -m ipykernel install --user --name cybersim --display-name cybersim
          jupyter kernelspec list
          cd notebooks
          bash run_quick.sh cybersim
        if: github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/wiblum')

      - name: Archive milled notebooks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papermilled-notebooks
          path: |
            notebooks/output/*.ipynb
            !dist/**/*.md
        if: github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/wiblum')
